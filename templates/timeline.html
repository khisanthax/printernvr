<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klipper Event Timeline | Printer NVR</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script defer src="/static/timeline.js?v={{ asset_version }}"></script>
</head>
<body>
  <header class="page-header page-header--single">
    <nav class="page-nav">
      <a href="/">Dashboard</a>
      <a href="/printers">Printers</a>
      <a href="/clips">Clips</a>
      <a href="/timeline" aria-current="page">Event Timeline</a>
    </nav>
    <h1>Klipper Event Timeline</h1>
  </header>
  <main class="page-main">
    <section class="clips-page timeline-page">
      <div class="clips-toolbar">
        <label>Printer <select id="timeline-printer">
          {% for id, name in printers %}<option value="{{ id }}">{{ name }}</option>{% endfor %}
        </select></label>
        <label>Recording <select id="timeline-clip"></select></label>
        <button type="button" class="control-button" id="timeline-refresh">Refresh events</button>
      </div>
      <p id="timeline-feedback" role="status"></p>
      <video id="timeline-player" class="clip-preview-player" controls preload="metadata" hidden></video>
      <div class="clips-toolbar">
        <label>Frame zero (ISO timestamp with timezone) <input id="timeline-anchor" placeholder="2026-11-23T10:00:00Z"></label>
        <label>Video correction (seconds) <input id="timeline-correction" type="number" step="0.1" value="0"></label>
        <label>Event clock <select id="timeline-clock">
          <option value="source">Source time when available</option>
          <option value="received">Recorder receipt time</option>
        </select></label>
        <button type="button" class="control-button" id="timeline-save" disabled>Save alignment</button>
        <button type="button" class="control-button" id="timeline-reset" disabled>Reset alignment</button>
      </div>
      <p id="timeline-anchor-note">Choose a completed MP4 to align events.</p>
      <div class="clips-toolbar">
        <label>Clip in (seconds) <input id="timeline-in" type="number" min="0" step="0.01" value="0"></label>
        <button type="button" class="control-button" id="timeline-mark-in">Set in at playhead</button>
        <label>Clip out (seconds) <input id="timeline-out" type="number" min="0" step="0.01"></label>
        <button type="button" class="control-button" id="timeline-mark-out">Set out at playhead</button>
        <button type="button" class="control-button" id="timeline-extract" disabled>Download segment</button>
      </div>
      <div class="clips-table-wrap">
        <table class="clips-table">
          <thead><tr><th>Event</th><th>Source time</th><th>Recorder received</th><th>Klipper clock (s)</th><th>Video</th></tr></thead>
          <tbody id="timeline-events"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
