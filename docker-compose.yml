services:
  printernvr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printernvr
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_CONFIG_PATH: ${APP_CONFIG_PATH:-/app/config/cameras.json}
      APP_APP_CONFIG_PATH: ${APP_APP_CONFIG_PATH:-/app/config/app.json}
      APP_RECORDINGS_DIR: ${APP_RECORDINGS_DIR:-/app/recordings}
      APP_LOGS_DIR: ${APP_LOGS_DIR:-/app/logs}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
    volumes:
      - ./config:/app/config
      - ./recordings:/app/recordings
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 45s
